{% extends "base.html" %}
{% set nav = "password" %}
{% block title %}Cambiar contraseña · Ventas a Meta{% endblock %}
{% block content %}
<div class="card" style="max-width:420px">
  <h2>Cambiar contraseña</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="cur">Contraseña actual</label>
    <input id="cur" name="current" type="password" autocomplete="current-password" required>
    <label for="new">Nueva contraseña (mínimo {{ min_len }} caracteres)</label>
    <input id="new" name="new" type="password" autocomplete="new-password" minlength="{{ min_len }}" required>
    <label for="conf">Confirmar nueva contraseña</label>
    <input id="conf" name="confirm" type="password" autocomplete="new-password" minlength="{{ min_len }}" required>
    <div class="row"><button class="primary" type="submit">Guardar</button></div>
  </form>
</div>
{% endblock %}
