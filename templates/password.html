{% extends "base.html" %}
{% set nav = "password" %}
{% block title %}Cambiar contraseña · Ventas a Meta{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Cambiar contraseña</h1><p>La nueva contraseña se guarda cifrada (hash) en la base.</p></div></div>
<section class="card" style="max-width:460px">
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="field" style="margin-top:0"><label for="cur">Contraseña actual</label>
      <div class="pw"><input id="cur" name="current" type="password" autocomplete="current-password" required><button type="button" aria-label="Mostrar" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></button></div></div>
    <div class="field"><label for="new">Nueva contraseña</label>
      <div class="pw"><input id="new" name="new" type="password" autocomplete="new-password" minlength="{{ min_len }}" required aria-describedby="new-h"><button type="button" aria-label="Mostrar" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></button></div>
      <span class="hint" id="new-h">Mínimo {{ min_len }} caracteres, distinta de la actual.</span></div>
    <div class="field"><label for="conf">Confirmar nueva contraseña</label>
      <div class="pw"><input id="conf" name="confirm" type="password" autocomplete="new-password" minlength="{{ min_len }}" required aria-describedby="conf-h"><button type="button" aria-label="Mostrar" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></button></div>
      <span class="hint" id="conf-h" aria-live="polite"></span></div>
    <div class="actions"><button class="primary" type="submit" data-busy="Guardando…">Guardar contraseña</button>
      <a class="btn" href="/">Cancelar</a></div>
  </form>
</section>
<script>
  (function () {
    var n = document.getElementById('new'), c = document.getElementById('conf'), h = document.getElementById('conf-h');
    function check() {
      var bad = c.value && n.value !== c.value;
      c.setCustomValidity(bad ? 'Las contraseñas no coinciden' : '');
      h.textContent = bad ? 'Las contraseñas no coinciden' : (c.value ? 'Coinciden' : '');
      h.className = 'hint ' + (bad ? 'err' : (c.value ? 'ok' : ''));
    }
    n.addEventListener('input', check); c.addEventListener('input', check);
  })();
</script>
{% endblock %}
