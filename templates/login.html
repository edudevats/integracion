{% extends "base.html" %}
{% block title %}Entrar · Ventas a Meta{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto">
  <h2>Ventas Leadsales → Meta</h2>
  <p class="muted">Inicia sesión para administrar la integración.</p>
  {% if missing %}<div class="flash error">Falta APP_PASSWORD en el archivo .env</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="u">Usuario</label>
    <input id="u" name="username" autocomplete="username" required autofocus>
    <label for="p">Contraseña</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <div class="row"><button class="primary" type="submit">Entrar</button></div>
  </form>
</div>
{% endblock %}
