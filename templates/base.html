<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ventas a Meta{% endblock %}</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1d2330; --muted:#667085; --line:#e4e7ec;
          --brand:#1877f2; --ok:#12805c; --okbg:#e7f6ef; --err:#b42318; --errbg:#fdeceb; --warn:#9a6700; --warnbg:#fff6db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1218; --card:#171b23; --text:#e6e8ec; --muted:#98a2b3; --line:#2a303b;
            --okbg:#0f2a20; --errbg:#2f1513; --warnbg:#2b2410; }
  }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text) }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card) }
  header { flex-wrap:wrap; gap:8px }
  header b { font-size:16px }
  nav { display:flex; gap:16px; align-items:center; flex-wrap:wrap; font-size:14px }
  nav a { color:var(--muted); text-decoration:none } nav a.on, nav a:hover { color:var(--text); font-weight:600 }
  a { color:var(--brand) }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 60px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:16px }
  .card h2 { margin:0 0 10px; font-size:16px }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px }
  .grid .card { margin:0 }
  .muted { color:var(--muted); font-size:13px }
  label { display:block; font-size:13px; color:var(--muted); margin:8px 0 4px }
  input, select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit }
  button, .btn { display:inline-block; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; cursor:pointer; text-decoration:none }
  button.primary, .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff }
  button.link { border:none; background:none; padding:0; color:var(--muted); text-decoration:underline }
  .row { display:flex; gap:8px; align-items:end; flex-wrap:wrap; margin-top:10px }
  .row > * { flex:1 1 140px }
  .row > button { flex:0 0 auto }
  .flash { padding:10px 14px; border-radius:8px; margin-bottom:12px }
  .flash.ok { background:var(--okbg); color:var(--ok) } .flash.error { background:var(--errbg); color:var(--err) }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; font-weight:600 }
  .pill.enviado { background:var(--okbg); color:var(--ok) } .pill.error { background:var(--errbg); color:var(--err) }
  .pill.omitido { background:var(--warnbg); color:var(--warn) }
  table { width:100%; border-collapse:collapse; font-size:13px }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top }
  th { color:var(--muted); font-weight:600 }
  .scroll { overflow-x:auto }
  .ok { color:var(--ok) } .err { color:var(--err) }
</style>
</head>
<body>
{% if session.user %}
<header>
  <b>Ventas Leadsales → Meta</b>
  <nav>
    <a href="/" class="{{ 'on' if nav == 'panel' }}">Panel</a>
    <a href="/clientes" class="{{ 'on' if nav == 'clientes' }}">Clientes enviados</a>
    <a href="/password" class="{{ 'on' if nav == 'password' }}">Cambiar contraseña</a>
    <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <button class="link" type="submit">Salir ({{ session.user }})</button></form>
  </nav>
</header>
{% endif %}
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
